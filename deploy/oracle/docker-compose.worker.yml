# Always-on worker on the Oracle Cloud VM (PRD 18.2). Writes to the hosted Postgres given in
# deploy/oracle/.env (DATABASE_URL, CONTACT_EMAIL). Run from the repository root:
#   docker compose -f deploy/oracle/docker-compose.worker.yml --env-file deploy/oracle/.env up -d --build
services:
  collector:
    build:
      context: ../..
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - /var/lib/dockcast/data:/app/data
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Second city (M20, owner decision 2026-11-05): Lyon Vélo'v, live status only. Same image;
  # only CITY differs. GBFS_ROOT_URL is blanked so an override meant for Dublin cannot leak in.
  collector-lyon:
    build:
      context: ../..
    env_file: .env
    environment:
      CITY: lyon
      GBFS_ROOT_URL: ""
      DATA_DIR: /app/data
    volumes:
      - /var/lib/dockcast/data:/app/data
    restart: unless-stopped
    logging: *logging

  # Met Éireann point forecast for the city centre, hourly at :20 (PRD 9.5; owner decision
  # 2026-10-25 to start collecting during M2). Same image as the collector.
  weather-forecast:
    build:
      context: ../..
    command: ["python", "-m", "dockcast.ingest.weather_forecast", "--loop"]
    env_file: .env
    restart: unless-stopped
    logging: *logging

  # Forecast job (PRD 6.2, M5): every 15 min (+60 s) resample recent live rows, predict
  # P10/P50/P90 at +30/+60/+120 and upsert `forecasts`. Uses the newest model bundle in
  # /var/lib/dockcast/data/models (copied from the research machine after `make train`).
  forecast:
    build:
      context: ../..
    command: ["python", "-m", "dockcast.serving.forecast", "--loop"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - /var/lib/dockcast/data:/app/data:ro
    restart: unless-stopped
    logging: *logging

  # Public read-only API (PRD 15, M17). Reachable only through Caddy; the rate limit sees the
  # client address from Caddy's X-Forwarded-For.
  api:
    build:
      context: ../..
    command: ["uvicorn", "dockcast.api.app:create_app", "--factory", "--host", "0.0.0.0",
              "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped
    logging: *logging

  # HTTPS in front of the API: automatic Let's Encrypt certificate for API_HOST
  # (e.g. 203-0-113-7.sslip.io; owner decision 2026-11-01).
  caddy:
    image: caddy:2.11.6-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Unset: Caddy serves localhost only (internal certificate), so the workers still run.
      API_HOST: ${API_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
