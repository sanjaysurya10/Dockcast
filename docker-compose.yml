services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dockcast
      POSTGRES_PASSWORD: dockcast
      POSTGRES_DB: dockcast
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockcast -d dockcast"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Long-running collector; survives terminal/app restarts. Start with `make collector-up`.
  collector:
    build: .
    profiles: ["collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://dockcast:dockcast@postgres:5432/dockcast
      CITY: ${CITY:-dublin}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      DATA_DIR: /app/data
    volumes:
      - ./data/raw/gbfs:/app/data/raw/gbfs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Postgres 17 (PRD 6.3, owner decision 2026-10-22). The old Postgres 16 volume `pgdata` is
  # no longer used; delete it only after confirming the restore.
  pgdata17:
