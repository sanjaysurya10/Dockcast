services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dockcast
      POSTGRES_PASSWORD: dockcast
      POSTGRES_DB: dockcast
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockcast -d dockcast"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
