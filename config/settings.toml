# Non-secret project configuration. Values mirror PRD decisions; change only with owner approval.

[forecast]
horizons_min = [30, 60, 120]          # PRD 1, 11.1
quantiles = [0.1, 0.5, 0.9]           # PRD G1
bucket_min = 15                       # PRD 9.4
event_window_min = 60                 # PRD 11.2

[backtest]
n_folds = 8                           # PRD 13.1 [DECISION]
test_window_days = 7
gap_min = 120

[spatial]
neighbour_k = 5                       # PRD 10.5
neighbour_radius_m = 600
e4_radii_m = [400, 600, 800]          # PRD 10.5 / E4: radii compared ...
e4_sweep_horizon_min = 60             # ... at this horizon; others use neighbour_radius_m (owner 2026-10-30)

[collector]
poll_interval_s = 60                  # PRD 9.1
station_info_refresh_h = 24
request_timeout_s = 10
retry_backoff_s = [1, 4, 16]
stale_after_min = 15

[retention]
raw_live_days = 7                     # PRD 18.4 (owner decision 2026-10-15)

[cleaning]                            # PRD 9.3; values from reports/eda.md, owner decisions 2026-10-25
spike_min_delta = 8                   # obs differing by >= this from BOTH neighbours (V-shape) ...
spike_max_gap_min = 10                # ... both neighbours within this many minutes -> excluded
rebalance_min_delta = 8               # max-min of bikes within the window >= this -> rebalance_flag
rebalance_window_min = 10
flatline_min_hours = 24               # unchanged bikes for >= this while renting -> flatline_flag
run_break_gap_min = 30                # a silence longer than this ends a flat-line run (data gap)
capacity_tolerance = 2                # bikes + docks > capacity + this -> capacity_mismatch

[serving]                             # PRD 6.2, 15.3, 15.4
run_offset_s = 60                     # forecast job runs this long after each 15-min boundary
stale_after_min = 30                  # live data older than this: no forecast, API answers 503
api_rate_limit = "60/minute"          # per IP (slowapi) [DECISION]

[clustering]                          # PRD 13 E3
k_min = 3
k_max = 8
min_cell_obs = 20                     # states per (station, day type, hour); fewer -> station left out
seed = 0
