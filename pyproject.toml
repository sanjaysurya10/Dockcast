[project]
name = "dockcast"
version = "0.0.0"
description = "Station-level bike availability forecasting for Dublin Bikes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.28.1",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2,<3",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.23.1",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dockcast"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D", "N", "RUF"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["dockcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services",
    "leakage: feature/target leakage checks (PRD 19.2)",
    "integration: needs Docker (Postgres testcontainer)",
    "api: API contract tests",
]

[tool.coverage.run]
source = ["dockcast"]
