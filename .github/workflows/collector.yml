name: collector-fallback

# PRD 18.2: polls once every 5 min only if the primary worker has not stored a successful run in
# the last 3 min. Off-peak minute offset (2, 7, 12, ...) because schedules at :00 are often delayed.
# Needs the repository secret DATABASE_URL (hosted Postgres); without it the job does nothing.

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: collector-fallback
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - name: Skip when no database is configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret not set; nothing to do."
      - uses: actions/checkout@v4
        if: ${{ env.DATABASE_URL != '' }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ env.DATABASE_URL != '' }}
      - name: Poll if primary is stale
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python -m dockcast.ingest.collector --once --if-stale-min 3
